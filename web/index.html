<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Git AutoPick — 自動化 git cherry-pick 批次工具，支援多專案目錄、自動 rollback 與模擬模式" />
  <title>Git AutoPick — 自動化 Cherry-Pick 工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Skip to main content for keyboard users -->
  <a class="skip-link" href="#main">跳至主要內容</a>

  <!-- ── Header ───────────────────────────────────────────────────── -->
  <header class="header" role="banner">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon" aria-hidden="true">🍒</span>
        <span class="logo-text">Git AutoPick</span>
        <span class="logo-badge">BETA</span>
      </div>
      <nav class="header-nav" aria-label="工具狀態">
        <div class="status-dot" id="status-dot" aria-live="polite" aria-label="伺服器連線狀態"></div>
        <span class="status-label" id="status-label">連線中...</span>
      </nav>
    </div>
  </header>

  <!-- ── Main ─────────────────────────────────────────────────────── -->
  <main id="main" class="main-layout">

    <!-- ── Left Panel: Form ──────────────────────────────────────── -->
    <section class="panel panel-form" aria-labelledby="form-title">
      <h1 id="form-title" class="panel-title">
        <span class="panel-title-icon" aria-hidden="true">⚙️</span>
        執行參數
      </h1>

      <form id="pick-form" novalidate>

        <!-- 專案目錄 -->
        <div class="field-group">
          <div class="field-group-header">
            <label class="field-label">
              <span class="field-label-row">
                目標專案目錄
                <span class="dir-count-badge is-zero" id="dir-count-badge" aria-live="polite">0</span>
              </span>
              <span class="field-hint">點擊按鈕選取要處理的專案目錄</span>
            </label>
            <button type="button" id="add-dir-btn" class="btn btn-ghost btn-sm" aria-label="新增專案目錄">+ 新增目錄</button>
          </div>

          <div id="project-dirs-container" class="dir-list-container" role="list">
            <div id="dir-list-empty" class="dir-empty">尚無選取的專案目錄</div>
            <!-- JS 動態插入項目 -->
          </div>
          <span class="field-error" id="project-dirs-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- 目標分支 -->
        <div class="field-row">
          <div class="field-group">
            <label class="field-label" for="branch">工作分支</label>
            <input
              type="text"
              id="branch"
              name="branch"
              class="field-input"
              value="main"
              placeholder="feat/my-change"
              aria-describedby="branch-error"
              autocomplete="off"
              spellcheck="false"
            />
            <span class="field-error" id="branch-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label class="field-label" for="remote">Fetch Remote</label>
            <input
              type="text"
              id="remote"
              name="remote"
              class="field-input"
              value="upstream"
              placeholder="upstream"
              aria-describedby="remote-error"
              autocomplete="off"
              spellcheck="false"
            />
            <span class="field-error" id="remote-error" role="alert" aria-live="polite"></span>
          </div>
        </div>

        <!-- Commit Hash -->
        <div class="field-group" id="commit-field-group">
          <label class="field-label" for="commit">Commit Hash</label>
          <input
            type="text"
            id="commit"
            name="commit"
            class="field-input field-mono"
            placeholder="a1b2c3d"
            aria-describedby="commit-error"
            autocomplete="off"
            spellcheck="false"
            maxlength="40"
          />
          <span class="field-error" id="commit-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- 推送 Remote（直推／PR 模式使用；僅更新分支不 push，不需要） -->
        <div class="field-group" id="push-remote-group">
          <label class="field-label" for="push-remote">
            推送 Remote
            <span class="field-hint">工作分支推送的目的地（預設 origin）</span>
          </label>
          <input
            type="text"
            id="push-remote"
            name="pushRemote"
            class="field-input"
            value="origin"
            placeholder="origin"
            aria-describedby="push-remote-error"
            autocomplete="off"
            spellcheck="false"
          />
          <span class="field-error" id="push-remote-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- 僅更新分支 -->
        <div class="field-toggle-row">
          <label class="toggle-label" for="update-only">
            <input type="checkbox" id="update-only" class="toggle-input" />
            <span class="toggle-track" aria-hidden="true">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-text">
              僅更新分支 <em>（只做 switch → pull，把工作分支拉到最新，不 cherry-pick、不 push）</em>
            </span>
          </label>
        </div>

        <!-- PR 模式 -->
        <div class="field-toggle-row" id="pr-mode-row">
          <label class="toggle-label" for="pr-mode">
            <input type="checkbox" id="pr-mode" class="toggle-input" />
            <span class="toggle-track" aria-hidden="true">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-text">
              PR 模式 <em>（從合併目標分支開新工作分支，cherry-pick 後推送工作分支，再以 PR 合入）</em>
            </span>
          </label>
        </div>

        <div id="pr-settings" class="pr-settings" hidden>
          <!-- 依目前輸入即時組出的實際指令序列，送出前即可確認會發生什麼事 -->
          <div class="pr-flow-preview" aria-labelledby="pr-flow-title">
            <p class="pr-flow-title" id="pr-flow-title">執行步驟（每個專案）</p>
            <ol class="pr-flow-steps" id="pr-flow-steps"></ol>
          </div>

          <p class="pr-track-hint" id="pr-track-hint">正在確認 PR 建立方式…</p>

          <div class="field-group">
            <label class="field-label" for="target-branch">
              合併目標分支
              <span class="field-hint">新分支的切出基準，同時作為 PR 的 base</span>
            </label>
            <input
              type="text"
              id="target-branch"
              name="targetBranch"
              class="field-input"
              value="main"
              placeholder="main"
              aria-describedby="target-branch-error"
              autocomplete="off"
              spellcheck="false"
            />
            <span class="field-error" id="target-branch-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label class="field-label" for="pr-title">
              PR 標題
              <span class="field-hint">留空時自動取用該 commit 的訊息標題</span>
            </label>
            <input
              type="text"
              id="pr-title"
              name="prTitle"
              class="field-input"
              placeholder="（自動）"
              autocomplete="off"
              maxlength="255"
            />
          </div>

          <!-- 自動合併：適用於「主線僅禁止直推、不要求審核核准」的專案 -->
          <div class="field-toggle-row field-toggle-nested">
            <label class="toggle-label" for="auto-merge">
              <input type="checkbox" id="auto-merge" class="toggle-input" />
              <span class="toggle-track" aria-hidden="true">
                <span class="toggle-thumb"></span>
              </span>
              <span class="toggle-text">
                建立後自動合併 <em>（需 gh CLI，且該分支不要求審核核准）</em>
              </span>
            </label>
          </div>

          <!-- 明說「關閉時會停在哪一步」，否則看不出 PR 究竟有沒有被建立 -->
          <p class="merge-state-hint" id="merge-state-hint"></p>

          <div id="merge-settings" class="merge-settings" hidden>
            <div class="field-group">
              <label class="field-label" for="merge-method">合併方式</label>
              <select id="merge-method" name="mergeMethod" class="field-input">
                <option value="squash" selected>Squash and merge</option>
                <option value="merge">Create a merge commit</option>
                <option value="rebase">Rebase and merge</option>
              </select>
            </div>

            <label class="checkbox-label" for="delete-branch-on-merge">
              <input type="checkbox" id="delete-branch-on-merge" checked />
              <span>合併後刪除工作分支（遠端與本地）</span>
            </label>
          </div>
        </div>

        <!-- 高風險分支確認卡：直推模式下工作分支命中名單時顯示 -->
        <div id="protected-warning" class="protected-warning" hidden role="alert">
          <p class="protected-warning-title">
            <span aria-hidden="true">⚠️</span>
            即將直接推送 <code id="protected-branch-name"></code> 至以下 <span id="protected-dir-count">0</span> 個專案：
          </p>
          <ul class="protected-warning-dirs" id="protected-dir-list"></ul>
          <p class="protected-warning-note">
            推送後若需退回，僅能以 <code>git revert</code> 產生反向提交——本工具不使用強制推送。
          </p>
          <label class="checkbox-label" for="confirm-protected">
            <input type="checkbox" id="confirm-protected" />
            <span>我確認要直接推送</span>
          </label>
        </div>

        <!-- 並發數量 (Concurrency) -->
        <div class="field-group">
          <label class="field-label" for="concurrency">
            並發數量
            <span class="field-hint">同時執行的專案數（預設 3，範圍 1~10）</span>
          </label>
          <input
            type="number"
            id="concurrency"
            name="concurrency"
            class="field-input"
            value="3"
            min="1"
            max="10"
            placeholder="3"
            aria-describedby="concurrency-error"
          />
          <span class="field-error" id="concurrency-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Dry-run toggle -->
        <div class="field-toggle-row">
          <label class="toggle-label" for="dry-run">
            <input type="checkbox" id="dry-run" class="toggle-input" />
            <span class="toggle-track" aria-hidden="true">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-text">
              模擬模式 <em>（不實際執行 git 命令）</em>
            </span>
          </label>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          id="submit-btn"
          class="btn btn-primary"
          aria-describedby="submit-status"
        >
          <span class="btn-icon" aria-hidden="true">▶</span>
          <span class="btn-text">開始執行</span>
        </button>
        <span id="submit-status" class="sr-only" aria-live="polite"></span>

      </form>
    </section>

    <!-- ── Right Panel: Log + Summary ───────────────────────────── -->
    <section class="panel panel-output" aria-labelledby="output-title">
      <div class="output-header">
        <h2 id="output-title" class="panel-title">
          <span class="panel-title-icon" aria-hidden="true">📋</span>
          執行日誌
        </h2>
        <button
          id="clear-btn"
          class="btn btn-ghost btn-sm"
          type="button"
          aria-label="清除日誌"
        >清除</button>
      </div>

      <!-- Log stream -->
      <div
        id="log-container"
        class="log-container"
        role="log"
        aria-label="執行日誌輸出"
        aria-live="polite"
        aria-atomic="false"
      >
        <div class="log-empty" id="log-empty" data-empty-state>
          <span aria-hidden="true">🌿</span>
          <p>執行後日誌將顯示於此</p>
        </div>
      </div>

      <!-- Skeleton template：送出請求到首筆 SSE 事件抵達前顯示 -->
      <template id="skeleton-template">
        <div class="skeleton-group" role="status" aria-label="正在連線並準備執行">
          <div class="skeleton-line w-40"></div>
          <div class="skeleton-line w-80"></div>
          <div class="skeleton-line w-60"></div>
        </div>
      </template>

      <!-- Summary cards -->
      <div id="summary-section" class="summary-section" hidden aria-labelledby="summary-title">
        <h3 id="summary-title" class="summary-title">執行摘要</h3>
        <div class="summary-grid" id="summary-grid" role="list"></div>
      </div>
    </section>

  </main>

  <!-- ── Progress Overlay ─────────────────────────────────────────── -->
  <div id="progress-overlay" class="progress-overlay" hidden aria-hidden="true">
    <div class="progress-pulse" aria-hidden="true"></div>
  </div>

  <!-- ── 目錄選擇 Modal ───────────────────────────────────────────── -->
  <div id="fs-modal" class="fs-modal" hidden>
    <div class="fs-modal-backdrop" data-fs-close></div>
    <div class="fs-modal-panel" role="dialog" aria-modal="true" aria-labelledby="fs-modal-title">
      <div class="fs-modal-header">
        <h2 id="fs-modal-title" class="fs-modal-title">
          <span aria-hidden="true">📂</span> 選擇專案目錄
        </h2>
        <button type="button" class="fs-modal-close" data-fs-close aria-label="關閉">✕</button>
      </div>

      <!-- 路徑輸入：可直接貼上絕對路徑，Enter 前往 -->
      <div class="fs-toolbar">
        <button type="button" id="fs-up" class="btn btn-ghost btn-sm" aria-label="上一層">↑ 上一層</button>
        <input
          type="text"
          id="fs-path-input"
          class="field-input fs-path-input"
          placeholder="貼上或輸入絕對路徑，按 Enter 前往"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" id="fs-go" class="btn btn-ghost btn-sm">前往</button>
      </div>

      <!-- 麵包屑 -->
      <div class="fs-breadcrumb" id="fs-breadcrumb" aria-label="路徑導覽"></div>

      <!-- 資料夾清單 -->
      <div class="fs-list" id="fs-list" role="listbox" aria-label="子資料夾" tabindex="0"></div>

      <div class="fs-modal-footer">
        <span class="fs-current" id="fs-current" title=""></span>
        <div class="fs-footer-actions">
          <button type="button" id="fs-add-current" class="btn btn-ghost btn-sm">＋ 加入目前資料夾</button>
          <button type="button" id="fs-done" class="btn btn-primary btn-sm">完成</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
